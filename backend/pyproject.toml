[project]
name = "ai-chat-backend"
version = "0.1.0"
description = "FastAPI backend cho AI Chat Web App"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: test thuần logic, không đụng HTTP",
    "integration: test đi qua TestClient/HTTP",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "SLF001"]

# --- taskipy: "npm scripts" cho Python ---
# Chạy:  task <ten>       (vd: task dev, task test)
# Xem danh sach:  task --list
[tool.taskipy.tasks]
dev      = { cmd = "uvicorn app.main:app --reload --port 8000", help = "Chay backend dev, tu reload khi sua code" }
mock     = { cmd = "uvicorn app.main:app --reload --port 8000 --env-file .env.mock", help = "Chay backend voi provider mock (khong can Ollama)" }
test     = { cmd = "pytest", help = "Chay toan bo test" }
test-u   = { cmd = "pytest -m unit", help = "Chi chay unit test" }
test-i   = { cmd = "pytest -m integration", help = "Chi chay integration test" }
lint     = { cmd = "ruff check .", help = "Kiem tra loi style/import" }
fix      = { cmd = "ruff check . --fix", help = "Tu sua loi lint sua duoc" }
fmt      = { cmd = "ruff format .", help = "Format lai code" }
check    = { cmd = "ruff check . && pytest", help = "Chay het: lint + test (dung truoc khi commit)" }
