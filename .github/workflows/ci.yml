name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  model:
    name: model (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install
        working-directory: model
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: model
        run: ruff check .

      # Tests use httpx MockTransport, so no Ollama server is needed.
      - name: Test
        working-directory: model
        run: pytest -q

  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      # The mock provider keeps the suite independent of any model server.
      - name: Test
        working-directory: backend
        env:
          LLM_PROVIDER: mock
          APP_ENV: test
        run: pytest -q

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The build is fully static, so a placeholder API URL is enough here.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # Single required check to protect the branch with, instead of listing all three.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [model, backend, frontend]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Có job thất bại."
            exit 1
          fi
          echo "Tất cả job đều pass."
